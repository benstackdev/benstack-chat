services:
  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api
  api:
    build: ./api
    ports:
      - "8080:8080"
  db:
    image: postgres:18-alpine
    env_file: ".env"
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
